name: PowerShell validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path . -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { exit 1 }
      - name: Build setup wizard
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $output = Join-Path $env:RUNNER_TEMP 'TVLibrarySetup.exe'
          & $compiler /nologo /target:winexe "/out:$output" /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Web.Extensions.dll ./TV-Library-Maintenance/Setup/TVLibrarySetup.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Library-Setup-Windows
          path: ${{ runner.temp }}/TVLibrarySetup.exe
          if-no-files-found: error
      - name: Read-only Analyze fixtures (PowerShell 7)
        shell: pwsh
        run: ./TV-Library-Maintenance/Tests/Test-Analyze.ps1 -ScratchPath (Join-Path $env:RUNNER_TEMP 'tv-analyze-pwsh')
      - name: Read-only Analyze fixtures (Windows PowerShell 5.1)
        shell: powershell
        run: ./TV-Library-Maintenance/Tests/Test-Analyze.ps1 -ScratchPath (Join-Path $env:RUNNER_TEMP 'tv-analyze-ps51')

